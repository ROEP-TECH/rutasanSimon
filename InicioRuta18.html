<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruta 18 - Acceso al Sistema</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between relative overflow-x-hidden">

  <!-- Imagen de Fondo (Combi / Transporte) con Overlay Verde -->
  <div class="fixed inset-0 z-0">
    <img 
      src="https://images.unsplash.com/photo-1570125909232-eb263c188f7e?auto=format&fit=crop&w=1920&q=80" 
      alt="Fondo Transporte Ruta 18" 
      class="w-full h-full object-cover object-center opacity-25 filter blur-[2px]"
    />
    <div class="absolute inset-0 bg-gradient-to-b from-slate-950/80 via-slate-950/90 to-slate-950"></div>
    <div class="absolute inset-0 bg-emerald-950/20 mix-blend-overlay"></div>
  </div>

  <!-- Header Institucional -->
  <header class="relative z-10 w-full max-w-5xl mx-auto px-4 pt-6 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="h-10 w-10 rounded-xl bg-gradient-to-br from-emerald-400 to-green-600 flex items-center justify-center font-extrabold text-slate-950 shadow-lg shadow-emerald-500/20 border border-emerald-300/30">
        18
      </div>
      <div>
        <span class="text-[10px] font-bold uppercase tracking-widest text-emerald-400">Sistema Operativo</span>
        <p class="text-sm font-semibold text-slate-200">Ruta 18 • Transporte Público</p>
      </div>
    </div>

    <!-- Indicador Discreto -->
    <div class="flex items-center gap-2 bg-slate-900/80 border border-slate-800 px-3 py-1.5 rounded-full backdrop-blur-md">
      <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span class="text-xs text-slate-300 font-medium">Servidor Activo</span>
    </div>
  </header>

  <!-- Contenido Central: Bienvenida + Tarjeta de Login Unificada -->
  <main class="relative z-10 w-full max-w-md mx-auto px-4 py-8 my-auto">
    
    <!-- Mensaje Principal -->
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-white tracking-tight">
        Bienvenido a <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-green-300">Ruta 18</span>
      </h1>
      <p class="text-slate-400 text-xs mt-2">
        Ingresa tus credenciales para acceder al panel de monitoreo.
      </p>
    </div>

    <!-- Tarjeta de Autenticación -->
    <div class="bg-slate-900/85 border border-slate-800 hover:border-emerald-500/30 p-6 md:p-8 rounded-3xl backdrop-blur-xl shadow-2xl transition-all">
      <form id="loginForm" class="space-y-4">
        
        <!-- Campo Correo -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Correo Electrónico</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <i data-lucide="user" class="w-4 h-4"></i>
            </span>
            <input 
              type="email" 
              id="userInput"
              required 
              placeholder="usuario@ruta18.com" 
              class="w-full bg-slate-950/60 border border-slate-800 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-slate-100 text-sm rounded-xl pl-10 pr-4 py-2.5 transition-all outline-none placeholder:text-slate-600"
            />
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </span>
            <input 
              type="password" 
              id="passwordInput"
              required 
              placeholder="••••••••" 
              class="w-full bg-slate-950/60 border border-slate-800 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-slate-100 text-sm rounded-xl pl-10 pr-4 py-2.5 transition-all outline-none placeholder:text-slate-600"
            />
          </div>
        </div>

        <!-- Mensaje de Error (Oculto por defecto) -->
        <div id="errorMessage" class="hidden p-3 rounded-xl bg-red-950/50 border border-red-500/30 text-red-300 text-xs text-center">
          Credenciales incorrectas. Intenta de nuevo.
        </div>

        <!-- Botón de Entrar -->
        <button 
          type="submit" 
          id="submitBtn"
          class="w-full mt-2 bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-slate-950 font-bold text-sm py-3 px-4 rounded-xl shadow-lg shadow-emerald-950/50 hover:shadow-emerald-500/20 transition-all flex items-center justify-center gap-2 group"
        >
          <span>Iniciar Sesión</span>
          <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
        </button>

      </form>
    </div>

    <!-- Leyenda de Seguridad -->
    <p class="text-center text-[11px] text-slate-500 mt-6 flex items-center justify-center gap-1.5">
      <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-500"></i>
      Acceso restringido únicamente a personal autorizado
    </p>

  </main>

  <!-- Footer -->
  <footer class="relative z-10 w-full max-w-5xl mx-auto px-4 pb-6 pt-4 text-center text-xs text-slate-500">
    Desarrollado por <strong class="text-emerald-400 font-semibold">ROEP TECH</strong> • Ruta 18 System
  </footer>

  <!-- Script de Control y Redirección -->
  <script>
    lucide.createIcons();

    // 1. INICIALIZAR SUPABASE (Asegúrate de poner tus claves reales aquí)
    const SUPABASE_URL = 'https://TU-PROYECTO.supabase.co';
    const SUPABASE_KEY = 'TU-ANON-KEY-AQUI';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. LÓGICA DE AUTENTICACIÓN Y REDIRECCIÓN
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const errorDiv = document.getElementById('errorMessage');
      
      // Feedback visual de estado cargando
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>Verificando...</span>`;
      errorDiv.classList.add('hidden');

      const email = document.getElementById('userInput').value.trim();
      const password = document.getElementById('passwordInput').value;

      try {
        // Step A: Iniciar Sesión en Supabase
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error || !data.user) {
          throw new Error('Correo o contraseña incorrectos.');
        }

        const userId = data.user.id;

        // Step B: Verificar si el usuario es Dueño
        const { data: owner } = await supabase
          .from('owners')
          .select('id')
          .eq('id', userId)
          .maybeSingle();

        if (owner) {
          window.location.href = './dueno/index.html';
          return;
        }

        // Step C: Verificar si es Checador
        const { data: checker } = await supabase
          .from('checkers') // Cambia por el nombre real de tu tabla si difiere
          .select('id')
          .eq('id', userId)
          .maybeSingle();

        if (checker) {
          window.location.href = './checador/index.html';
          return;
        }

        // Step D: Verificar si es Chofer
        const { data: driver } = await supabase
          .from('drivers') // Cambia por el nombre real de tu tabla si difiere
          .select('id')
          .eq('id', userId)
          .maybeSingle();

        if (driver) {
          window.location.href = './chofer/index.html';
          return;
        }

        // Si existe la cuenta pero no está en ninguna tabla de roles
        throw new Error('Tu cuenta no tiene un rol asignado en el sistema.');

      } catch (err) {
        // Manejo de errores
        errorDiv.textContent = err.message || 'Error de inicio de sesión.';
        errorDiv.classList.remove('hidden');
        
        // Restaurar botón
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Iniciar Sesión</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
