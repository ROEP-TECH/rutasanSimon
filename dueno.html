<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E293B">
<title>Panel del Dueño · Ruta San Simón (R-18)</title>
<meta name="robots" content="noindex, nofollow">

<link rel="manifest" href="manifest-dueno.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
  }
}
</script>
<script type="module" src="dueno-logic.js"></script>

<style>
  :root {
    --bg-page: #F8FAFC;
    --card-bg: #FFFFFF;
    --text-primary: #0F172A;
    --text-muted: #475569;
    --brand-blue: #1E40AF;
    --brand-blue-hover: #1E3A8A;
    --border-color: #CBD5E1;
  }

  body {
    background-color: var(--bg-page);
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  .card-senior {
    background: var(--card-bg);
    border: 2px solid var(--border-color);
    border-radius: 1.25rem;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
  }

  #map {
    height: 320px;
    width: 100%;
    border-radius: 1rem;
    z-index: 1;
  }

  .leaflet-container {
    font-family: 'Plus Jakarta Sans', sans-serif !important;
  }

  [data-lucide] {
    stroke-width: 2.2;
  }

  /* Estados de conductor */
  .status-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .status-dot.on {
    background-color: #16A34A;
    box-shadow: 0 0 0 4px #DCFCE7;
  }
  .status-dot.off {
    background-color: #94A3B8;
  }

  .driver-row {
    padding: 1rem 0;
    border-bottom: 2px solid #F1F5F9;
  }
  .driver-row:last-child {
    border-bottom: none;
  }

  /* Tarjetas de alertas */
  .alert-card {
    border: 2px solid #EF4444;
    background-color: #FEF2F2;
    border-radius: 1.25rem;
    padding: 1rem;
    margin-bottom: 0.75rem;
  }
  .alert-card.resolved {
    border-color: var(--border-color);
    background-color: #F8FAFC;
    opacity: 0.8;
  }

  @keyframes flash-senior {
    0%, 100% { background-color: #FEF2F2; }
    50% { background-color: #FCA5A5; }
  }
  .alert-card.flashing {
    animation: flash-senior 1s ease-in-out 3;
  }

  #alarmBar {
    display: none;
  }
  #alarmBar.show {
    display: flex;
  }
  @keyframes alarmPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.75; }
  }
  #alarmBar.show {
    animation: alarmPulse 1s ease-in-out infinite;
  }

  #installBtn.show {
    display: inline-flex;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body class="pb-12">

<!-- BARRA DE ALARMA SUPERIOR -->
<div id="alarmBar" class="fixed top-0 inset-x-0 z-[100] items-center justify-between gap-3 px-5 py-4 bg-red-600 text-white font-bold text-lg shadow-xl">
  <span class="flex items-center gap-3">
    <i data-lucide="siren" class="w-7 h-7 animate-bounce"></i>
    ¡ALERTA DE AYUDA ACTIVA!
  </span>
  <button id="silenceBtn" class="bg-white text-red-700 hover:bg-red-50 text-base font-extrabold px-5 py-2.5 rounded-xl border-2 border-red-200 active:scale-95 transition">
    Silenciar
  </button>
</div>

<!-- PANTALLA DE LOGIN -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center px-4 py-8">
  <div class="card-senior p-8 w-full max-w-md text-center border-3 border-slate-300">
    
    <div class="w-20 h-20 rounded-3xl mx-auto mb-4 bg-blue-900 text-white flex items-center justify-center shadow-md">
      <i data-lucide="key-round" class="w-10 h-10"></i>
    </div>
    
    <h1 class="font-extrabold text-2xl text-slate-900">Panel del Dueño</h1>
    <p class="text-base font-bold text-slate-600 mt-1">Ruta San Simón · R-18</p>
    
    <div class="mt-6 text-left space-y-4">
      <div>
        <label for="emailInput" class="block text-sm font-extrabold text-slate-700 uppercase tracking-wider mb-1">
          Correo electrónico
        </label>
        <input id="emailInput" type="email" placeholder="ejemplo@correo.com"
               class="w-full text-lg px-4 py-3.5 rounded-xl border-2 border-slate-300 bg-slate-50 text-slate-900 font-medium focus:bg-white focus:border-blue-700 focus:outline-none">
      </div>
      
      <div>
        <label for="passwordInput" class="block text-sm font-extrabold text-slate-700 uppercase tracking-wider mb-1">
          Contraseña
        </label>
        <input id="passwordInput" type="password" placeholder="••••••••"
               class="w-full text-lg px-4 py-3.5 rounded-xl border-2 border-slate-300 bg-slate-50 text-slate-900 font-medium focus:bg-white focus:border-blue-700 focus:outline-none">
      </div>
    </div>
    
    <p id="loginError" class="text-base font-bold mt-4 p-3 bg-red-100 text-red-700 border-2 border-red-300 rounded-xl hidden">
      Correo o contraseña incorrectos.
    </p>

    <button id="loginSubmit" class="mt-6 w-full py-4 text-xl font-extrabold rounded-xl bg-blue-800 text-white hover:bg-blue-900 active:scale-98 transition shadow-lg">
      ENTRAR AL PANEL
    </button>
  </div>
</div>

<!-- PANEL PRINCIPAL -->
<div id="mainScreen" class="hidden max-w-xl mx-auto px-4 pt-6 space-y-5">
  
  <!-- ENCABEZADO -->
  <header class="card-senior p-4 flex items-center justify-between gap-3">
    <button id="logoutBtn" aria-label="Cerrar sesión" class="flex items-center justify-center w-12 h-12 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 border-2 border-slate-300 shrink-0 font-bold active:scale-95">
      <i data-lucide="log-out" class="w-6 h-6"></i>
    </button>
    
    <div class="text-center flex-1">
      <h1 class="font-extrabold text-xl text-slate-900 leading-tight">Panel del Dueño</h1>
      <p class="text-sm font-bold text-slate-600">Ruta San Simón · R-18</p>
    </div>

    <button id="installBtn" aria-label="Instalar app" class="hidden items-center gap-2 px-4 h-12 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold text-sm shrink-0 border-2 border-amber-600 shadow-md">
      <i data-lucide="download" class="w-5 h-5"></i> Instalar
    </button>
  </header>

  <!-- ADVERTENCIA SUPABASE -->
  <div id="supabaseWarning" class="hidden card-senior p-5 text-base font-bold text-center bg-red-50 border-red-400 text-red-800">
    <i data-lucide="alert-triangle" class="w-6 h-6 mx-auto mb-1 text-red-600"></i>
    Supabase no está configurado.
  </div>

  <!-- CONDUCTORES -->
  <section class="card-senior p-5">
    <div class="flex items-center justify-between mb-3 border-b-2 border-slate-200 pb-3">
      <h2 class="font-extrabold text-lg text-slate-900 uppercase tracking-wide flex items-center gap-2">
        <i data-lucide="users" class="w-6 h-6 text-blue-800"></i> Conductores
      </h2>
      <span id="driversOnlineCount" class="text-base font-extrabold px-3 py-1 bg-slate-100 border border-slate-300 rounded-lg text-slate-800">
        —
      </span>
    </div>
    <div id="driversList" class="divide-y-2 divide-slate-100 text-base font-semibold"></div>
  </section>

  <!-- AVISOS DE RUTA -->
  <section class="card-senior p-5">
    <h2 class="font-extrabold text-lg text-slate-900 uppercase tracking-wide mb-3 flex items-center gap-2 border-b-2 border-slate-200 pb-3">
      <i data-lucide="flag" class="w-6 h-6 text-blue-800"></i> Avisos recientes
    </h2>
    <div id="routeEventsList" class="space-y-3">
      <p id="routeEventsEmpty" class="text-base font-medium text-slate-600 text-center py-3">
        Todavía no hay avisos de los conductores hoy.
      </p>
    </div>
  </section>

  <!-- MAPA -->
  <section class="card-senior p-2">
    <div id="map"></div>
  </section>

  <!-- ALERTAS -->
  <section class="card-senior p-5">
    <h2 class="font-extrabold text-lg text-slate-900 uppercase tracking-wide mb-3 flex items-center gap-2 border-b-2 border-slate-200 pb-3">
      <i data-lucide="bell" class="w-6 h-6 text-red-600"></i> Alertas de ayuda
    </h2>
    
    <div id="alertsEmpty" class="p-4 rounded-xl bg-slate-50 border-2 border-dashed border-slate-300 text-base font-semibold text-slate-600 text-center flex items-center justify-center gap-2">
      <i data-lucide="check-circle-2" class="w-5 h-5 text-green-600"></i> No hay alertas por ahora.
    </div>
    
    <div id="alertsList" class="space-y-3 mt-3"></div>
  </section>

</div>

</body>
</html>
